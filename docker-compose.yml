x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Les noms de services sont préfixés (cdg-) : sur un hôte partagé comme Dokploy, des noms génériques
# (db, backend, frontend) peuvent entrer en collision avec ceux d'autres projets sur le même réseau Docker.
services:
  cdg-db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME:-chemin_de_guer}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Pas de port publié : la base n'est accessible que depuis le réseau Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-chemin_de_guer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sauvegarde automatique de la base (quotidienne, vérifiée, copie hors serveur facultative) : voir docs/deploiement.md
  cdg-backup:
    build: ./backup
    restart: unless-stopped
    logging: *logging
    environment:
      DB_HOST: cdg-db
      DB_NAME: ${DB_NAME:-chemin_de_guer}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      TZ: ${TZ:-Europe/Paris}
      BACKUP_CRON: ${BACKUP_CRON:-30 3 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-chemin-de-guer}
      BACKUP_SFTP_HOST: ${BACKUP_SFTP_HOST:-}
      BACKUP_SFTP_PORT: ${BACKUP_SFTP_PORT:-22}
      BACKUP_SFTP_USER: ${BACKUP_SFTP_USER:-}
      BACKUP_SFTP_PASSWORD: ${BACKUP_SFTP_PASSWORD:-}
      BACKUP_SFTP_PATH: ${BACKUP_SFTP_PATH:-chemin-de-guer}
    volumes:
      # BACKUP_DIR : dossier du serveur où déposer les sauvegardes (chemin absolu, par exemple /var/backups/chemin-de-guer),
      # utile pour qu'un NAS les récupère ; sans valeur, un volume Docker est utilisé.
      - ${BACKUP_DIR:-backups}:/backups
    depends_on:
      cdg-db:
        condition: service_healthy
    # Alerte visuelle (docker ps) : aucune sauvegarde réussie depuis plus de 2 jours
    healthcheck:
      test: ["CMD-SHELL", "find /backups/last_success -mmin -2880 2>/dev/null | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 5m

  cdg-backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      DB_HOST: cdg-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-chemin_de_guer}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SHABBAT_ENABLED: ${SHABBAT_ENABLED:-true}
      SHABBAT_GEONAME_ID: ${SHABBAT_GEONAME_ID:-2988507}
      SHABBAT_TIMEZONE: ${SHABBAT_TIMEZONE:-Europe/Paris}
      SHABBAT_MARGIN_MINUTES: ${SHABBAT_MARGIN_MINUTES:-30}
      COMMENTS_ENABLED: ${COMMENTS_ENABLED:-true}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      AUTHOR_NAME: ${AUTHOR_NAME:-Anthony Gorski}
      AUTHOR_URL: ${AUTHOR_URL:-https://www.agorski.dev}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
    depends_on:
      cdg-db:
        condition: service_healthy
    # Pas de port publié : seul nginx (cdg-frontend) joint le backend.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cdg-frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      cdg-backend:
        condition: service_healthy
    # Aucun port publié ici : en production, le reverse proxy (Traefik de Dokploy) route vers le port 80
    # du conteneur. Pour un accès direct (local, VPS sans proxy), voir docker-compose.override.yml.

volumes:
  postgres_data:
  backups:
