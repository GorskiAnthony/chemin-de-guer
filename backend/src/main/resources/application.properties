spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chemin_de_guer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Session et cookies
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none

# Actuator : seul /health est exposé
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Application
app.public-url=${APP_PUBLIC_URL:http://localhost}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Fermeture pour Shabbat (ville de référence : Paris)
shabbat.enabled=${SHABBAT_ENABLED:true}
shabbat.geoname-id=${SHABBAT_GEONAME_ID:2988507}
shabbat.timezone=${SHABBAT_TIMEZONE:Europe/Paris}
shabbat.margin-minutes=${SHABBAT_MARGIN_MINUTES:30}
