spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chemin_de_guer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Session et cookies
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none

# Actuator : seul /health est exposé
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Le serveur SMTP est facultatif : son indisponibilité ne doit jamais rendre le backend « unhealthy »
management.health.mail.enabled=false

# Application
app.public-url=${APP_PUBLIC_URL:http://localhost}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Fermeture pour Shabbat (ville de référence : Paris)
shabbat.enabled=${SHABBAT_ENABLED:true}
shabbat.geoname-id=${SHABBAT_GEONAME_ID:2988507}
shabbat.timezone=${SHABBAT_TIMEZONE:Europe/Paris}
shabbat.margin-minutes=${SHABBAT_MARGIN_MINUTES:30}

# Commentaires : interrupteur général par défaut (modifiable ensuite depuis l'administration)
app.comments.enabled=${COMMENTS_ENABLED:true}

# Notification email des nouveaux commentaires : active uniquement si MAIL_HOST et MAIL_TO sont renseignés
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}
app.mail.to=${MAIL_TO:${ADMIN_EMAIL:}}

# Identité du site (balises SEO, données structurées, llms.txt)
app.site.name=Chemin de Guer
app.author.name=${AUTHOR_NAME:Anthony Gorski}
app.author.url=${AUTHOR_URL:https://www.agorski.dev}
# Page HTML de base de l'application (index.html servi par nginx), dans laquelle le backend injecte les balises SEO
app.seo.shell-url=${SEO_SHELL_URL:http://cdg-frontend/index.html}

# Référencement : false = le site porte une directive noindex partout (aperçus de partage conservés)
app.seo.indexable=${SITE_INDEXABLE:false}
