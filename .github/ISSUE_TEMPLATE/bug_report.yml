name: Signalement de bug
description: Signaler un comportement anormal ou un bug
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décris le bug de façon claire et concise.
      placeholder: Explique ce qui ne fonctionne pas.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Liste les étapes précises pour reproduire le bug.
      placeholder: |
        1. Aller sur ...
        2. Cliquer sur ...
        3. Observer ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce qui devrait se passer normalement.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
      description: Ce qui se passe réellement.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Composant concerné
      options:
        - Frontend (Angular)
        - Backend (Spring Boot)
        - Base de données (PostgreSQL)
        - Docker / déploiement
        - Autre
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version de l'application
      placeholder: "ex. v1.0.0, ou le hash du commit"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Système d'exploitation
      placeholder: "ex. macOS 15, Windows 11, Ubuntu 24.04"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Navigateur (si applicable)
      placeholder: "ex. Chrome 130, Firefox 132"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / captures d'écran
      description: Colle ici les logs pertinents, ou ajoute des captures d'écran.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Vérifications
      options:
        - label: J'ai vérifié qu'aucune issue similaire n'existe déjà
          required: true
