# Zones à ne pas indexer : administration et API. L'en-tête X-Robots-Tag est omis quand sa valeur est vide.
map $request_uri $robots_tag {
    ~^/(admin|api)(/|$) "noindex, nofollow, noarchive";
    default "";
}

# Limitation d'écriture : seuls les POST sont comptés (clé vide = pas de limite)
map $request_method $post_ip {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $post_ip zone=writes:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Derrière un reverse proxy (Traefik), récupère l'IP réelle du visiteur dans X-Forwarded-For.
    # Seuls les proxys situés dans des réseaux privés sont crus : un visiteur ne peut pas falsifier son IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Robots-Tag $robots_tag always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    # Icônes : cache court pour pouvoir les changer sans attendre 30 jours
    location ~* ^/(favicon|apple-touch-icon|icon-).*\.(ico|png|svg)$ {
        expires 1d;
        try_files $uri =404;
    }

    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sans slash final : le préfixe /api/ est conservé jusqu'au backend.
    location /api/ {
        limit_req zone=writes burst=10 nodelay;
        proxy_pass http://cdg-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml { proxy_pass http://cdg-backend:8080/api/sitemap.xml; }
    location = /rss.xml     { proxy_pass http://cdg-backend:8080/api/rss.xml; }
}
