upstream cdg_backend {
    server cdg-backend:8080;
}

# Zones à ne pas indexer : administration et API. L'en-tête X-Robots-Tag est omis quand sa valeur est vide.
map $request_uri $robots_tag {
    ~^/(admin|api)(/|$) "noindex, nofollow, noarchive";
    default "";
}

# Limitation d'écriture : seuls les POST sont comptés (clé vide = pas de limite)
map $request_method $post_ip {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $post_ip zone=writes:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Derrière un reverse proxy (Traefik), récupère l'IP réelle du visiteur dans X-Forwarded-For.
    # Seuls les proxys situés dans des réseaux privés sont crus : un visiteur ne peut pas falsifier son IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    # Le backend ajoute déjà certains de ces en-têtes : on garde uniquement ceux de nginx (pas de doublons)
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;

    # En-têtes transmis au backend par toutes les routes proxifiées
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain text/html;

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Icônes : cache court pour pouvoir les changer sans attendre 30 jours
    location ~* ^/(favicon|apple-touch-icon|icon-|og-default).*\.(ico|png|svg)$ {
        expires 1d;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # API : le préfixe /api/ est conservé jusqu'au backend.
    location /api/ {
        limit_req zone=writes burst=10 nodelay;
        proxy_pass http://cdg_backend;
    }

    # Pages publiques : le backend renvoie index.html enrichi (balises SEO et de partage, données structurées,
    # texte de la page), indispensable aux robots qui n'exécutent pas JavaScript. En cas d'indisponibilité du
    # backend, la page statique de l'application est servie.
    location = / {
        proxy_pass http://cdg_backend/api/seo/page?path=/;
        error_page 502 503 504 = @spa;
    }
    location ~ ^/(articles|paracha|fetes)(/[a-z0-9-]+)?/?$ {
        proxy_pass http://cdg_backend/api/seo/page?path=$uri;
        error_page 502 503 504 = @spa;
    }
    location @spa {
        try_files /index.html =503;
    }

    # Administration : application seule (noindex via l'en-tête X-Robots-Tag)
    location ^~ /admin {
        try_files /index.html =404;
    }

    # Images de partage générées pour chaque article et chaque paracha
    location ^~ /og/ {
        proxy_pass http://cdg_backend/api/og/;
    }

    location = /robots.txt    { proxy_pass http://cdg_backend/api/robots.txt; }
    location = /sitemap.xml   { proxy_pass http://cdg_backend/api/sitemap.xml; }
    location = /rss.xml       { proxy_pass http://cdg_backend/api/rss.xml; }
    location = /llms.txt      { proxy_pass http://cdg_backend/api/llms.txt; }
    location = /llms-full.txt { proxy_pass http://cdg_backend/api/llms-full.txt; }

    # Toute autre adresse : fichier statique ou vraie réponse 404 (la page de l'application s'affiche quand même)
    location / {
        try_files $uri =404;
        error_page 404 /index.html;
    }
}
